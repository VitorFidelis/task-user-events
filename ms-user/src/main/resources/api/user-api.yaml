openapi: 3.0.0

info:
  title: User API
  description: User Management API
  version: 1.0.0

servers:
  - url: http://localhost:8081
    description: Local server

tags:
  - name: Users
    description: Operations related to users

paths:
  /api/v1/users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Retrieve a paginated list of users
      operationId: getAllUsers
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/status'
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResult'
        '400':
          description: Bad request
        '500':
          description: Internal server error

    post:
      tags:
        - Users
      summary: Create a new user
      description: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          headers:
            Location:
              description: URI of the created resource
              schema:
                type: string
                format: uri
                example: /api/v1/users/123
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '500':
          description: Internal server error

  /api/v1/users/{userId}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve a user by their ID
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          description: The ID of the user
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '404':
          description: User not found
        '500':
          description: Internal server error

    put:
      tags:
        - Users
      summary: Update user by ID
      description: Update a user by their ID
      operationId: updateUserById
      parameters:
        - name: userId
          in: path
          required: true
          description: The ID of the user
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
        '404':
          description: User not found
        '500':
          description: Internal server error

  /api/v1/users/{userId}/deactivate:
    patch:
      tags:
        - Users
      summary: Deactivate user
      description: Deactivate a user by ID
      operationId: deactivateUserById
      parameters:
        - name: userId
          in: path
          required: true
          description: The ID of the user
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User deactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
        '500':
          description: Internal server error

  /api/v1/users/{userId}/reactivate:
    patch:
      tags:
        - Users
      summary: Reactivate user
      description: Reactivate a user by ID
      operationId: reactivateUserById
      parameters:
        - name: userId
          in: path
          required: true
          description: The ID of the user
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: User reactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
        '500':
          description: Internal server error

components:
  parameters:
    page:
      name: page
      in: query
      description: Page number (default 0)
      schema:
        type: integer
        default: 0

    size:
      name: size
      in: query
      description: Page size (default 10)
      schema:
        type: integer
        default: 10

    sort:
      name: sort
      in: query
      description: Sort order (e.g. id,asc)
      schema:
        type: string
        example: 'id,asc'

    status:
      name: status
      in: query
      description: Filter by task status
      required: false
      schema:
        type: string
        enum:
          - ACTIVE
          - DEACTIVATED

  schemas:
    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          description: The username of the user
        email:
          type: string
          format: email
          description: The email of the user
        password:
          type: string
          description: the password of the user

    UpdateUserRequest:
      type: object
      required:
        - username
        - email
      properties:
        username:
          type: string
          description: the username of the user
        email:
          type: string
          format: email
          description: the email of the user

    PaginatedResult:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
        size:
          type: integer
        sort:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - DEACTIVATED
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: The unique identifier for the user
        username:
          type: string
          description: The username of the user
        email:
          type: string
          format: email
          description: The email of the user
        password:
          type: string
          description: The password of the user
        status:
          type: string
          description: The current status of the user
          enum:
            - ACTIVE
            - DEACTIVATED
        createdAt:
          type: string
          format: date-time
          description: The date and time when the user was created
        updatedAt:
          type: string
          format: date-time
          description: The date and time when the user was updated
        activatedAt:
          type: string
          format: date-time
          description: The date and time when the user was activated
        deactivatedAt:
          type: string
          format: date-time
          description: The date and time when the user was deactivated
